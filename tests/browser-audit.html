<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local portfolio accessibility audit</title></head>
<body>
<h1>Local portfolio accessibility audit</h1>
<p>This development tool requires <code>npm install</code> and <code>npm run dev</code>. It is not part of the portfolio navigation.</p>
<pre id="results">Running…</pre>
<script type="module">
  const pages = ['index.html', 'projects.html', 'experience.html', 'education.html', 'recognition.html', 'about.html', '404.html'];
  const width = Number(new URLSearchParams(location.search).get('width')) || 1440;
  window.auditResults = [];
  for (const page of pages) {
    const frame = document.createElement('iframe');
    frame.title = `Audit of ${page}`;
    frame.style.cssText = `width:${width}px;height:900px;border:0;display:block`;
    const loaded = new Promise(resolve => frame.onload = resolve);
    frame.src = `../${page}`;
    document.body.append(frame);
    await loaded;
    const child = frame.contentWindow;
    await child.document.fonts.ready;
    await Promise.all(child.document.getAnimations().map(animation => animation.finished));
    const script = child.document.createElement('script');
    const ready = new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; });
    script.src = '../node_modules/axe-core/axe.min.js';
    child.document.head.append(script);
    await ready;
    const result = await child.axe.run(child.document, { runOnly: { type: 'tag', values: ['wcag2a', 'wcag2aa', 'wcag21aa', 'best-practice'] } });
    window.auditResults.push({ page, width, violations: result.violations.map(v => ({ id: v.id, impact: v.impact, description: v.description, nodes: v.nodes.map(n => ({target:n.target, summary:n.failureSummary})) })), passes: result.passes.length });
    frame.remove();
    document.querySelector('#results').textContent = JSON.stringify(window.auditResults, null, 2);
  }
  document.body.dataset.complete = 'true';
</script>
</body>
</html>
